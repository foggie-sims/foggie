# Example MUSIC template for the multizoom pipeline (25 Mpc/h, 512^3 base).
#
# This is a stand-in for your production template (e.g. the
# 25Mpc_DM_512_planck18.conf used for the existing L0 run).  The multizoom
# wrapper only ever READS the template: per-level confs are written as new
# files with levelmax/region/output keys filled in.
#
# Requirements for multizoom use:
#  * every seed[<level>] the deepest zoom will need must be listed here —
#    identical seeds across runs are what make union runs, merge runs, and
#    single-zoom references samples of the same realization;
#  * use the SAME template for every halo and every mode (the merge tool
#    hard-fails on any seed/cosmology mismatch);
#  * do not set no_shift here — the wrapper sets it per-run in merge mode.

[setup]
boxlength   = 25
zstart      = 99
levelmin    = 9
levelmin_TF = 9
levelmax    = 9
padding     = 8
overlap     = 4
align_top   = yes
baryons     = no
use_2LPT    = yes
use_LLA     = no
periodic_TF = yes

[cosmology]
Omega_m  = 0.291
Omega_L  = 0.709
Omega_b  = 0.04576
H0       = 70.0
sigma_8  = 0.8159
nspec    = 0.9667
transfer = camb_file
transfer_file = ../enzo-mrp-music/wmap9_transfer_function_z99.dat

[random]
seed[9]  = 201510130
seed[10] = 301510130
seed[11] = 401510130
seed[12] = 501510130
seed[13] = 601510130

[output]
format   = enzo
filename = 25Mpc_DM_512-L0

[poisson]
accuracy      = 1e-5
pre_smooth    = 3
post_smooth   = 3
smoother      = gs
laplace_order = 6
grad_order    = 6
