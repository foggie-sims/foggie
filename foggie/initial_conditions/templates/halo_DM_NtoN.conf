[setup]

music_exe_dir = FOGGIE_REPO/initial_conditions/music
simulation_name = __SIM_NAME__
template_config = FOGGIE_ICS_DIR/__TEMPLATE_CONFIG__
original_config = FOGGIE_ICS_DIR/__TEMPLATE_CONFIG__

# Where the previous level's Enzo outputs are read from.
simulation_run_directory = FOGGIE_ICS_DIR

# Where this level's new ICs are written.  Kept separate from
# simulation_run_directory so the zoom reads its parent level from the shared
# ICs directory but deposits its own ICs inside the halo directory.
new_ics_directory = FOGGIE_ICS_DIR/HALO_DIR

num_cores = None

[region]
final_type = halo
final_redshift = 0.0
halo_center = 0.5, 0.5, 0.5
halo_center_units = code_length
halo_radius = 200.
halo_radius_units = kpc
radius_factor = 1.0
shape_type = convex_hull
