[setup]
boxlength 	= 25.0
zstart		= 99
levelmin	= 8
levelmin_TF	= 8
levelmax	= 8
padding		= 4
overlap		= 8
# For zoom-in ICs, set these two parameters
#ref_dims	= 512,512,512
#ref_center      = 0.5,0.5,0.5
align_top	= no
baryons		= yes
use_2LPT	= yes
use_LLA		= no
periodic_TF	= yes
center_vel      = no

[cosmology]
Omega_m			= 0.291
Omega_L			= 0.709
Omega_b                 = 0.04576
H0			= 70.0 
sigma_8			= 0.810
nspec			= 0.9665
transfer                = camb_file
transfer_file           = /nobackup/jtumlins/foggie/foggie/initial_conditions/planck18_cosmology/camb_47799596_transfer_z99.dat 

[random]
cubesize = 256
seed[5]  = 23
seed[6]  = 17
seed[7]  = 255
seed[8]  = 192
seed[9]  = 410
seed[10] = 2171
seed[11] = 115976
seed[12] = 678571
seed[13] = 4213599
# seed[14] and seed[15] added 2026-09-09 to open L5/L6 without a new realization.
# MUSIC builds the noise strictly top-down (random.cc compute_random_numbers:
# level N from level N-1 plus seed[N]) and only generates levels <= levelmax, so
# these two lines are parsed but unused by every build at levelmax <= 13 -- the
# existing L1-L4 ladder stays bit-identical.  correct_avg, the one path that
# would push fine information back to coarse levels, runs only under
# kspace_TF = no, and main.cc defaults it to yes.  Drawn from the OS CSPRNG.
seed[14] = 60583433
seed[15] = 29314491

[output]
format              = enzo
filename            = 25Mpc_DM_256-L0-gas

[poisson]
fft_fine		= no
accuracy		= 1e-5
pre_smooth		= 3
post_smooth		= 3
smoother		= gs
laplace_order		= 6
grad_order		= 6
